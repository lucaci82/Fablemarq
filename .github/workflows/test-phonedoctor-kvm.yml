name: Build and test PhoneDoctor v1.3 Auto-Fix

on:
  push:
    branches:
      - chatgpt/phonedoctor-build
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare PhoneDoctor v1.3
        run: |
          rm -rf /tmp/pd13
          mkdir -p /tmp/pd13
          unzip -q tools/phonedoctor/v13/PhoneDoctor_Android_v1.3_Project.zip -d /tmp/pd13

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build APK
        working-directory: /tmp/pd13/PhoneDoctorAndroid_v1_3
        run: gradle --no-daemon :app:assembleDebug

      - name: Android 16 launcher test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r /tmp/pd13/PhoneDoctorAndroid_v1_3/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.phonedoctor.autofix -c android.intent.category.LAUNCHER 1
            sleep 10
            adb logcat -d -v threadtime > /tmp/pd13-logcat.txt
            adb shell uiautomator dump /sdcard/pd13.xml
            adb pull /sdcard/pd13.xml /tmp/pd13.xml
            grep -q 'PHONE DOCTOR' /tmp/pd13.xml
            grep -q 'AUTORIZZA AUTO-FIX' /tmp/pd13.xml
            if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.phonedoctor\.autofix' /tmp/pd13-logcat.txt; then exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-v1.3-AutoFix-APK
          path: /tmp/pd13/PhoneDoctorAndroid_v1_3/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-v1.3-test-diagnostics
          path: |
            /tmp/pd13.xml
            /tmp/pd13-logcat.txt
          if-no-files-found: warn
