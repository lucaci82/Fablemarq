name: Build and test PhoneDoctor v1.2 Android 16

on:
  push:
    branches:
      - chatgpt/phonedoctor-build
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare PhoneDoctor v1.2
        run: |
          cat tools/phonedoctor/PhoneDoctor_Android_Project.zip.b64.part* > /tmp/pd.b64
          base64 -d /tmp/pd.b64 > /tmp/pd.zip
          mkdir -p /tmp/pd
          unzip -q /tmp/pd.zip -d /tmp/pd
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/pd/PhoneDoctorAndroid')

          # Use a new application id so Android cannot confuse this build with an older
          # debug-signed installation. Keep the Java class package unchanged and refer
          # to it explicitly from the manifest.
          p = root/'app/build.gradle'
          s = p.read_text()
          s = s.replace("applicationId 'com.phonedoctor.app'", "applicationId 'com.phonedoctor.app12'")
          s = s.replace('targetSdk 36', 'targetSdk 34')
          s = s.replace('versionCode 1', 'versionCode 3')
          s = s.replace("versionName '1.0.0'", "versionName '1.2.0'")
          p.write_text(s)

          # Explicit launcher manifest + real app icon.
          manifest = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Phone Doctor 1.2"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:hardwareAccelerated="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.phonedoctor.app.MainActivity"
                      android:exported="true"
                      android:label="Phone Doctor 1.2">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''
          (root/'app/src/main/AndroidManifest.xml').write_text(manifest)

          icon = '''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#111827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M47,22h14v25h25v14h-25v25h-14v-25h-25v-14h25z"/>
          </vector>
          '''
          icon_path = root/'app/src/main/res/drawable/ic_launcher.xml'
          icon_path.parent.mkdir(parents=True, exist_ok=True)
          icon_path.write_text(icon)

          # Make startup and each individual diagnostic resilient.
          p = root/'app/src/main/java/com/phonedoctor/app/MainActivity.java'
          s = p.read_text()
          old = '''    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(buildUi());\n    }'''
          new = '''    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        try {\n            setContentView(buildUi());\n            main.postDelayed(this::startScan, 450);\n        } catch (Throwable t) {\n            TextView v = new TextView(this);\n            v.setPadding(dp(24), dp(40), dp(24), dp(24));\n            v.setTextSize(16);\n            v.setTextColor(Color.rgb(153, 27, 27));\n            v.setText("Phone Doctor: errore di avvio\\n" + t.getClass().getSimpleName());\n            setContentView(v);\n        }\n    }'''
          if old in s:
              s = s.replace(old, new)
          s = s.replace('button("SCANSIONE COMPLETA", true)', 'button("RIPETI SCANSIONE", true)')
          s = s.replace('text("Premi “Scansione completa” per iniziare.", 18', 'text("Avvio scansione automatica…", 18')
          old2 = '''        executor.execute(() -> {\n            ScannerEngine.ScanReport r = new ScannerEngine(this).scan();\n            main.post(() -> render(r));\n        });'''
          new2 = '''        executor.execute(() -> {\n            try {\n                ScannerEngine.ScanReport r = new ScannerEngine(this).scan();\n                main.post(() -> render(r));\n            } catch (Throwable t) {\n                main.post(() -> { progress.setVisibility(View.GONE); scanButton.setEnabled(true); summary.setText("Scansione interrotta: " + t.getClass().getSimpleName()); });\n            }\n        });'''
          if old2 in s:
              s = s.replace(old2, new2)
          p.write_text(s)

          p = root/'app/src/main/java/com/phonedoctor/app/ScannerEngine.java'
          s = p.read_text()
          old = '''    public ScanReport scan() {\n        findings.clear();\n        tech.setLength(0);\n        addDeviceInfo();\n        checkSecurityPatch();\n        checkBattery();\n        checkMemory();\n        checkStorage();\n        checkThermals();\n        checkNetwork();\n        checkSecuritySettings();\n        checkBootAndRootHeuristics();\n        checkWebView();\n        sortFindings();\n        return new ScanReport(System.currentTimeMillis(), new ArrayList<>(findings), tech.toString());\n    }'''
          new = '''    public ScanReport scan() {\n        findings.clear();\n        tech.setLength(0);\n        safeCheck("Informazioni dispositivo", this::addDeviceInfo);\n        safeCheck("Patch sicurezza", this::checkSecurityPatch);\n        safeCheck("Batteria", this::checkBattery);\n        safeCheck("Memoria", this::checkMemory);\n        safeCheck("Archiviazione", this::checkStorage);\n        safeCheck("Termica", this::checkThermals);\n        safeCheck("Rete", this::checkNetwork);\n        safeCheck("Sicurezza", this::checkSecuritySettings);\n        safeCheck("WebView", this::checkWebView);\n        sortFindings();\n        return new ScanReport(System.currentTimeMillis(), new ArrayList<>(findings), tech.toString());\n    }\n    private interface Check { void run(); }\n    private void safeCheck(String name, Check c) {\n        try { c.run(); } catch (Throwable t) { add(Level.INFO, name, "Controllo non disponibile (" + t.getClass().getSimpleName() + ")."); }\n    }'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build APK
        working-directory: /tmp/pd/PhoneDoctorAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Android 16 launcher test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install /tmp/pd/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.phonedoctor.app12 | tee /tmp/package-path.txt
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.phonedoctor.app12 | tee /tmp/resolve.txt
            grep -q 'com.phonedoctor.app.MainActivity' /tmp/resolve.txt
            adb logcat -c
            adb shell monkey -p com.phonedoctor.app12 -c android.intent.category.LAUNCHER 1 | tee /tmp/monkey.txt
            sleep 12
            adb logcat -d -v threadtime > /tmp/pd-logcat.txt
            adb shell uiautomator dump /sdcard/pd.xml
            adb pull /sdcard/pd.xml /tmp/pd.xml
            grep -q 'PHONE DOCTOR' /tmp/pd.xml
            grep -q 'Stato:' /tmp/pd.xml
            if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.phonedoctor\.app12' /tmp/pd-logcat.txt; then exit 1; fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-v1.2-APK
          path: /tmp/pd/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-v1.2-test-diagnostics
          path: |
            /tmp/package-path.txt
            /tmp/resolve.txt
            /tmp/monkey.txt
            /tmp/pd.xml
            /tmp/pd-logcat.txt
          if-no-files-found: warn
