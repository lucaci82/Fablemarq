name: Build PhoneDoctor APK

on:
  push:
    branches:
      - chatgpt/phonedoctor-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Rebuild project archive
        run: |
          cat tools/phonedoctor/PhoneDoctor_Android_Project.zip.b64.part* > /tmp/phonedoctor.b64
          base64 -d /tmp/phonedoctor.b64 > /tmp/phonedoctor.zip
          mkdir -p /tmp/phonedoctor
          unzip -q /tmp/phonedoctor.zip -d /tmp/phonedoctor
          test -f /tmp/phonedoctor/PhoneDoctorAndroid/settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        working-directory: /tmp/phonedoctor/PhoneDoctorAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f /tmp/phonedoctor/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/phonedoctor/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk PhoneDoctor-debug.apk
          sha256sum PhoneDoctor-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-APK
          path: PhoneDoctor-debug.apk
          if-no-files-found: error
