name: Test TradeMarkerAI Android 16

on:
  push:
    branches:
      - chatgpt/trademarketai-v1
    paths:
      - "tools/trademarketai/app/**"
      - ".github/workflows/test-trademarketai-kvm.yml"
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: tools/trademarketai/app
        run: gradle --no-daemon :app:assembleDebug

      - name: Android 16 launcher test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r "$GITHUB_WORKSPACE/tools/trademarketai/app/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm path com.luca.trademarkerai
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.luca.trademarkerai > /tmp/tm-resolve.txt
            grep -q 'MainActivity' /tmp/tm-resolve.txt
            adb logcat -c
            adb shell monkey -p com.luca.trademarkerai -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d -v threadtime > /tmp/tm-logcat.txt
            adb shell uiautomator dump /sdcard/tm.xml
            adb pull /sdcard/tm.xml /tmp/tm.xml
            grep -q 'TRADEMARKERAI' /tmp/tm.xml
            grep -q 'ANALIZZA MERCATO' /tmp/tm.xml
            if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.luca\.trademarkerai' /tmp/tm-logcat.txt; then exit 1; fi

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeMarkerAI-v1-tested-APK
          path: tools/trademarketai/app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TradeMarkerAI-v1-test-diagnostics
          path: |
            /tmp/tm.xml
            /tmp/tm-logcat.txt
            /tmp/tm-resolve.txt
          if-no-files-found: warn
