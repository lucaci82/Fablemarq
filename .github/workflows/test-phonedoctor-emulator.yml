name: Test PhoneDoctor v1.1 on Android 16 emulator

on:
  push:
    branches:
      - chatgpt/phonedoctor-build
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Rebuild project archive
        run: |
          cat tools/phonedoctor/PhoneDoctor_Android_Project.zip.b64.part* > /tmp/phonedoctor.b64
          base64 -d /tmp/phonedoctor.b64 > /tmp/phonedoctor.zip
          mkdir -p /tmp/phonedoctor
          unzip -q /tmp/phonedoctor.zip -d /tmp/phonedoctor
          test -f /tmp/phonedoctor/PhoneDoctorAndroid/settings.gradle

      - name: Apply v1.1 stability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/phonedoctor/PhoneDoctorAndroid')
          b=root/'app/build.gradle'
          s=b.read_text().replace('targetSdk 36','targetSdk 34').replace('versionCode 1','versionCode 2').replace("versionName '1.0.0'","versionName '1.1.0'")
          b.write_text(s)
          p=root/'app/src/main/java/com/phonedoctor/app/MainActivity.java'
          s=p.read_text()
          s=s.replace('''    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(buildUi());\n    }''','''    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        try {\n            setContentView(buildUi());\n            main.postDelayed(this::startScan, 450);\n        } catch (Throwable t) {\n            TextView v = new TextView(this);\n            v.setPadding(dp(24), dp(40), dp(24), dp(24));\n            v.setTextSize(16);\n            v.setTextColor(Color.rgb(153, 27, 27));\n            v.setBackgroundColor(Color.WHITE);\n            v.setText("Phone Doctor: errore di avvio\\n\\n" + t.getClass().getSimpleName() + ": " + (t.getMessage() == null ? "nessun dettaglio" : t.getMessage()));\n            setContentView(v);\n        }\n    }''')
          s=s.replace('button("SCANSIONE COMPLETA", true)', 'button("RIPETI SCANSIONE", true)')
          s=s.replace('text("Premi “Scansione completa” per iniziare.", 18', 'text("Avvio scansione automatica…", 18')
          s=s.replace('''        executor.execute(() -> {\n            ScannerEngine.ScanReport r = new ScannerEngine(this).scan();\n            main.post(() -> render(r));\n        });''','''        executor.execute(() -> {\n            try {\n                ScannerEngine.ScanReport r = new ScannerEngine(this).scan();\n                main.post(() -> render(r));\n            } catch (Throwable t) {\n                main.post(() -> renderScanError(t));\n            }\n        });''')
          marker='    private void render(ScannerEngine.ScanReport r) {'
          s=s.replace(marker,'''    private void renderScanError(Throwable t) {\n        progress.setVisibility(View.GONE);\n        scanButton.setEnabled(true);\n        summary.setTextColor(Color.rgb(153, 27, 27));\n        String message = t.getMessage() == null ? "nessun dettaglio" : t.getMessage();\n        summary.setText("Scansione interrotta\\n" + t.getClass().getSimpleName() + ": " + message);\n    }\n\n'''+marker)
          p.write_text(s)
          p=root/'app/src/main/java/com/phonedoctor/app/ScannerEngine.java'
          s=p.read_text()
          old='''    public ScanReport scan() {\n        findings.clear();\n        tech.setLength(0);\n        addDeviceInfo();\n        checkSecurityPatch();\n        checkBattery();\n        checkMemory();\n        checkStorage();\n        checkThermals();\n        checkNetwork();\n        checkSecuritySettings();\n        checkBootAndRootHeuristics();\n        checkWebView();\n        sortFindings();\n        return new ScanReport(System.currentTimeMillis(), new ArrayList<>(findings), tech.toString());\n    }'''
          new='''    public ScanReport scan() {\n        findings.clear();\n        tech.setLength(0);\n        safeCheck("Informazioni dispositivo", this::addDeviceInfo);\n        safeCheck("Patch sicurezza", this::checkSecurityPatch);\n        safeCheck("Batteria", this::checkBattery);\n        safeCheck("Memoria", this::checkMemory);\n        safeCheck("Archiviazione", this::checkStorage);\n        safeCheck("Termica", this::checkThermals);\n        safeCheck("Rete", this::checkNetwork);\n        safeCheck("Sicurezza", this::checkSecuritySettings);\n        safeCheck("WebView", this::checkWebView);\n        sortFindings();\n        return new ScanReport(System.currentTimeMillis(), new ArrayList<>(findings), tech.toString());\n    }\n\n    private interface Check { void run(); }\n    private void safeCheck(String name, Check check) {\n        try { check.run(); }\n        catch (Throwable t) {\n            add(Level.INFO, name, "Controllo non disponibile su questo dispositivo (" + t.getClass().getSimpleName() + ").");\n            addTech(name + " errore", t.getClass().getSimpleName());\n        }\n    }'''
          assert old in s
          p.write_text(s.replace(old,new))
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        working-directory: /tmp/phonedoctor/PhoneDoctorAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Android 16 launch and scan test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            APK=/tmp/phonedoctor/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.phonedoctor.app
            adb shell am start -W -n com.phonedoctor.app/.MainActivity | tee /tmp/am-start-v11.txt
            sleep 12
            adb logcat -d -v threadtime > /tmp/logcat-v11.txt
            adb shell uiautomator dump /sdcard/window-v11.xml
            adb pull /sdcard/window-v11.xml /tmp/window-v11.xml
            echo '=== UI ==='
            cat /tmp/window-v11.xml
            echo '=== CRASH/FATAL ==='
            grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.phonedoctor\.app|Unable to start activity' /tmp/logcat-v11.txt || true
            if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.phonedoctor\.app' /tmp/logcat-v11.txt; then
              echo 'PhoneDoctor crashed'
              exit 1
            fi
            grep -q 'PHONE DOCTOR' /tmp/window-v11.xml
            grep -q 'Stato:' /tmp/window-v11.xml || { echo 'Automatic scan did not finish'; exit 1; }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-v1.1-Android16-diagnostics
          path: |
            /tmp/am-start-v11.txt
            /tmp/logcat-v11.txt
            /tmp/window-v11.xml
          if-no-files-found: warn
