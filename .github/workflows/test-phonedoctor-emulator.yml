name: Test PhoneDoctor on Android emulator

on:
  push:
    branches:
      - chatgpt/phonedoctor-build
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Rebuild project archive
        run: |
          cat tools/phonedoctor/PhoneDoctor_Android_Project.zip.b64.part* > /tmp/phonedoctor.b64
          base64 -d /tmp/phonedoctor.b64 > /tmp/phonedoctor.zip
          mkdir -p /tmp/phonedoctor
          unzip -q /tmp/phonedoctor.zip -d /tmp/phonedoctor
          test -f /tmp/phonedoctor/PhoneDoctorAndroid/settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        working-directory: /tmp/phonedoctor/PhoneDoctorAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            APK=/tmp/phonedoctor/PhoneDoctorAndroid/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.phonedoctor.app
            adb shell am start -W -n com.phonedoctor.app/.MainActivity | tee /tmp/am-start.txt
            sleep 4
            adb shell dumpsys activity activities | grep -A 8 -B 2 com.phonedoctor.app > /tmp/activity.txt || true
            adb shell dumpsys window | grep -A 5 -B 5 com.phonedoctor.app > /tmp/window.txt || true
            adb logcat -d -v threadtime > /tmp/logcat.txt
            echo '=== AM START ==='
            cat /tmp/am-start.txt
            echo '=== ACTIVITY ==='
            cat /tmp/activity.txt
            echo '=== CRASH/FATAL ==='
            grep -Ei 'FATAL EXCEPTION|AndroidRuntime|Process: com\.phonedoctor\.app|Force finishing|has died|Unable to start activity' /tmp/logcat.txt || true
            if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.phonedoctor\.app' /tmp/logcat.txt; then
              echo 'PhoneDoctor crashed during launch'
              exit 1
            fi
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/window.xml || true
            grep -q 'PHONE DOCTOR' /tmp/window.xml || { echo 'Expected Phone Doctor UI not found'; cat /tmp/window.xml || true; exit 1; }

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneDoctor-emulator-diagnostics
          path: |
            /tmp/am-start.txt
            /tmp/activity.txt
            /tmp/window.txt
            /tmp/logcat.txt
            /tmp/window.xml
          if-no-files-found: warn
